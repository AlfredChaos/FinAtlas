services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: finatlas
      POSTGRES_PASSWORD: finatlas
      POSTGRES_DB: finatlas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finatlas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finatlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - finatlas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - finatlas-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

networks:
  finatlas-net:
    driver: bridge

volumes:
  postgres_data:
